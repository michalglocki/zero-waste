name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: packages/code-reviewer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Fork PRs do not receive repository secrets by default.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
          cache-dependency-path: packages/code-reviewer/package-lock.json

      - name: Install code-reviewer
        working-directory: packages/code-reviewer
        run: npm ci

      - name: Run code reviewer
        id: review
        working-directory: packages/code-reviewer
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_RUNTIME: cloud
          CURSOR_CLOUD_REPO_URL: https://github.com/${{ github.repository }}
          CURSOR_CLOUD_STARTING_REF: ${{ github.event.pull_request.head.sha }}
          CURSOR_CLOUD_PR_URL: ${{ github.event.pull_request.html_url }}
          REVIEW_BASE: origin/${{ github.base_ref }}
          REVIEW_FAIL_ON: request_changes
        run: |
          set -euo pipefail
          set +e
          # Invoke tsx directly — `npm start` prints banners to stdout and pollutes JSON capture.
          ./node_modules/.bin/tsx src/index.ts \
            > "$GITHUB_WORKSPACE/review-output.json" \
            2> "$GITHUB_WORKSPACE/review-stderr.txt"
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

          if ! node -e "const fs=require('fs'); const t=fs.readFileSync(process.env.GITHUB_WORKSPACE + '/review-output.json','utf8').trim(); if(!t) process.exit(2); const j=JSON.parse(t); if(!j.summary||!Array.isArray(j.findings)||!j.verdict) process.exit(3);"; then
            echo "Reviewer did not produce schema-shaped JSON (exit $status)." >&2
            cat "$GITHUB_WORKSPACE/review-stderr.txt" >&2 || true
            echo "---- stdout ----" >&2
            cat "$GITHUB_WORKSPACE/review-output.json" >&2 || true
            # Never treat malformed output as success, even if tsx exited 0.
            if [[ "$status" -eq 0 ]]; then
              exit 1
            fi
            exit "$status"
          fi

          # Also enforce REVIEW_FAIL_ON via parsed JSON (belt-and-suspenders vs CLI exit code).
          if node -e "const j=JSON.parse(require('fs').readFileSync(process.env.GITHUB_WORKSPACE + '/review-output.json','utf8')); const fail=(process.env.REVIEW_FAIL_ON||'').split(',').map(s=>s.trim()).filter(Boolean); if(fail.includes(j.verdict)) process.exit(2);"; then
            :
          else
            echo "exit_code=2" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Comment review on PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('review-output.json','utf8'));" 2>/dev/null; then
            echo "Skipping PR comment — no valid review JSON."
            exit 0
          fi

          body_file="$RUNNER_TEMP/review-comment.md"
          {
            echo "## Code reviewer report"
            echo
            echo "Generated by \`packages/code-reviewer\` against \`origin/${{ github.base_ref }}...HEAD\` (Cursor cloud runtime)."
            echo
            echo '<details><summary>Structured review JSON</summary>'
            echo
            echo '```json'
            cat review-output.json
            echo
            echo '```'
            echo
            echo '</details>'
            if [[ -s review-stderr.txt ]]; then
              echo
              echo '<details><summary>Reviewer stderr</summary>'
              echo
              echo '```'
              cat review-stderr.txt
              echo
              echo '```'
              echo
              echo '</details>'
            fi
          } > "$body_file"

          existing="$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments?per_page=100" \
            --jq '[.[] | select(.user.type=="Bot" and (.body | contains("## Code reviewer report"))) | .id] | last' \
            || true)"
          if [[ -n "${existing}" && "${existing}" != "null" ]]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/${existing}" \
              -F body=@"$body_file" >/dev/null
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body-file "$body_file"
          fi

      - name: Fail on reviewer error or request_changes
        if: always()
        run: |
          set -euo pipefail
          status="${{ steps.review.outputs.exit_code }}"
          if [[ -z "$status" ]]; then
            echo "Review step did not report an exit code."
            exit 1
          fi
          if [[ "$status" != "0" ]]; then
            echo "Reviewer exited with status $status"
            if [[ -f review-stderr.txt ]]; then
              cat review-stderr.txt >&2 || true
            fi
            exit "$status"
          fi
