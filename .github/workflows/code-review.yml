name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: packages/code-reviewer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
          cache-dependency-path: packages/code-reviewer/package-lock.json

      - name: Install code-reviewer
        working-directory: packages/code-reviewer
        run: npm ci

      - name: Run code reviewer
        id: review
        working-directory: packages/code-reviewer
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          REVIEW_BASE: origin/${{ github.base_ref }}
          REVIEW_FAIL_ON: request_changes
        run: |
          set -euo pipefail
          set +e
          npm start > "$GITHUB_WORKSPACE/review-output.json" 2> "$GITHUB_WORKSPACE/review-stderr.txt"
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [[ ! -s "$GITHUB_WORKSPACE/review-output.json" ]]; then
            echo "Reviewer produced no JSON output (exit $status)." >&2
            cat "$GITHUB_WORKSPACE/review-stderr.txt" >&2 || true
            exit "$status"
          fi
          exit 0

      - name: Comment review on PR
        if: always() && hashFiles('review-output.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/review-comment.md"
          {
            echo "## Code reviewer report"
            echo
            echo "Generated by \`packages/code-reviewer\` against \`origin/${{ github.base_ref }}...HEAD\`."
            echo
            echo '<details><summary>Structured review JSON</summary>'
            echo
            echo '```json'
            cat review-output.json
            echo
            echo '```'
            echo
            echo '</details>'
            if [[ -s review-stderr.txt ]]; then
              echo
              echo '<details><summary>Reviewer stderr</summary>'
              echo
              echo '```'
              cat review-stderr.txt
              echo
              echo '```'
              echo
              echo '</details>'
            fi
          } > "$body_file"

          # Replace previous bot comment from this workflow when possible
          existing="$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[] | select(.user.type=="Bot" and (.body | contains("## Code reviewer report"))) | .id' \
            | head -n1 || true)"
          if [[ -n "${existing}" ]]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/${existing}" \
              -F body=@"$body_file" >/dev/null
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body-file "$body_file"
          fi

      - name: Fail on reviewer error or request_changes
        if: always()
        run: |
          set -euo pipefail
          status="${{ steps.review.outputs.exit_code }}"
          if [[ -z "$status" ]]; then
            echo "Review step did not report an exit code."
            exit 1
          fi
          if [[ "$status" != "0" ]]; then
            echo "Reviewer exited with status $status"
            if [[ -f review-stderr.txt ]]; then
              cat review-stderr.txt >&2 || true
            fi
            exit "$status"
          fi
